name: Generate Mihon indexes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - index.min.json
      - config.json
      - generate_pb.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate protobuf files
        run: python generate_pb.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.pb repo.json
          git diff --cached --quiet || git commit -m "Update Mihon indexes"
          git push
